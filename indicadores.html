<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indicadores SGI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#1e293b;display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
.sb{width:220px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sb-logo{padding:18px 16px 12px;border-bottom:1px solid #f1f5f9}
.sb-logo span{font-size:13px;font-weight:700;color:#1e293b;letter-spacing:.3px}
.sb-logo sub{display:block;font-size:10px;color:#94a3b8;font-weight:400;margin-top:1px}
.sb-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px 10px;border-bottom:1px solid #f1f5f9}
.sb-stat{background:#f8fafc;border-radius:8px;padding:8px 10px}
.sb-stat-n{font-size:18px;font-weight:700;color:#1e293b;line-height:1}
.sb-stat-l{font-size:9px;color:#94a3b8;margin-top:2px;text-transform:uppercase;letter-spacing:.4px}
.sb-stat.ok .sb-stat-n{color:#16a34a}
.sb-stat.no .sb-stat-n{color:#dc2626}
.sb-stat.nd .sb-stat-n{color:#94a3b8}
.sb-section{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;padding:10px 14px 4px}
.sb-scroll{overflow-y:auto;flex:1}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:12px;color:#475569;border-radius:0;transition:background .1s}
.sb-item:hover{background:#f8fafc}
.sb-item.active{background:#eff6ff;color:#2563eb;font-weight:600}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-count{margin-left:auto;font-size:10px;color:#94a3b8;background:#f1f5f9;border-radius:10px;padding:1px 6px}
.sb-item.active .sb-count{background:#dbeafe;color:#3b82f6}
/* MAIN LIST */
.list{flex:1;display:flex;flex-direction:column;overflow:hidden}
.list-top{padding:16px 20px 12px;background:#fff;border-bottom:1px solid #e2e8f0;flex-shrink:0}
.list-top h1{font-size:15px;font-weight:700;color:#1e293b}
.list-top p{font-size:11px;color:#94a3b8;margin-top:2px}
.list-body{overflow-y:auto;flex:1;padding:0}
.sec-hd{padding:10px 20px 4px;font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:2}
.ind-row{display:flex;align-items:center;gap:10px;padding:9px 20px;background:#fff;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .1s}
.ind-row:hover{background:#f8fafc}
.ind-row.active{background:#eff6ff}
.row-dot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.row-info{flex:1;min-width:0}
.row-code{font-size:10px;color:#94a3b8;font-weight:500}
.row-name{font-size:12px;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.row-score{font-size:15px;font-weight:700;line-height:1}
.row-score.ok{color:#16a34a}
.row-score.no{color:#dc2626}
.row-score.nd{color:#94a3b8}
.chip{font-size:9px;font-weight:600;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.4px}
.chip-ok{background:#dcfce7;color:#16a34a}
.chip-no{background:#fee2e2;color:#dc2626}
.chip-nd{background:#f1f5f9;color:#94a3b8}
/* DETAIL PANEL */
.detail{width:420px;background:#fff;border-left:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transform:translateX(420px);transition:transform .2s}
.detail.open{transform:translateX(0)}
.det-close{position:absolute;top:12px;right:12px;background:none;border:none;font-size:18px;color:#94a3b8;cursor:pointer;z-index:3;padding:4px 8px;border-radius:6px}
.det-close:hover{background:#f1f5f9;color:#475569}
.det-hd{padding:20px;border-bottom:1px solid #f1f5f9;position:relative}
.det-dot{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;margin-bottom:10px}
.det-code{font-size:10px;color:#94a3b8;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.det-name{font-size:15px;font-weight:700;color:#1e293b;margin:4px 0 8px;line-height:1.3}
.det-tags{display:flex;gap:6px;flex-wrap:wrap}
.det-tag{font-size:10px;background:#f1f5f9;color:#64748b;padding:2px 8px;border-radius:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px 20px;border-bottom:1px solid #f1f5f9}
.kpi{background:#f8fafc;border-radius:10px;padding:10px}
.kpi-n{font-size:20px;font-weight:700;color:#1e293b;line-height:1}
.kpi-n.ok{color:#16a34a}
.kpi-n.no{color:#dc2626}
.kpi-l{font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.chart-sec{flex:1;display:flex;flex-direction:column;padding:14px 20px;overflow:hidden}
.chart-toggle{display:flex;gap:0;background:#f1f5f9;border-radius:8px;padding:3px;margin-bottom:12px;width:fit-content}
.toggle-btn{padding:5px 14px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer;color:#64748b;background:none;transition:all .15s}
.toggle-btn.active{background:#fff;color:#1e293b;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chart-wrap{flex:1;overflow:hidden;min-height:0}
.chart-wrap svg{width:100%;height:100%}
.det-foot{padding:12px 20px;border-top:1px solid #f1f5f9;font-size:11px;color:#64748b;display:flex;gap:16px;flex-wrap:wrap}
.det-foot span{display:flex;align-items:center;gap:4px}
/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;width:90%;max-width:700px;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:16px;font-weight:700;margin-bottom:4px}
.modal-sub{font-size:12px;color:#64748b;margin-bottom:20px}
.modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;margin-top:-4px}
</style>
</head>
<body>
<!-- SIDEBAR -->
<aside class="sb">
  <div class="sb-logo">
    <span>SGI Indicadores</span>
    <sub id="sb-ej-label">Cargando...</sub>
  </div>
  <div class="sb-stats" id="sb-stats"></div>
  <div class="sb-scroll">
    <div class="sb-section">Áreas</div>
    <div id="sb-areas"></div>
    <div class="sb-section">Ejercicio</div>
    <div id="sb-ejs"></div>
  </div>
</aside>

<!-- MAIN LIST -->
<main class="list">
  <div class="list-top">
    <h1 id="list-title">Todos los indicadores</h1>
    <p id="list-sub"></p>
  </div>
  <div class="list-body" id="list-body"></div>
</main>

<!-- DETAIL PANEL -->
<aside class="detail" id="detail">
  <button class="det-close" onclick="closeDetail()">×</button>
  <div class="det-hd">
    <div class="det-dot" id="det-dot"></div>
    <div class="det-code" id="det-code"></div>
    <div class="det-name" id="det-name"></div>
    <div class="det-tags" id="det-tags"></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="chart-sec">
    <div class="chart-toggle">
      <button class="toggle-btn active" id="btn-ej" onclick="setMode('ej')">Por ejercicio</button>
      <button class="toggle-btn" id="btn-per" onclick="setMode('per')">Períodos</button>
    </div>
    <div class="chart-wrap" id="chart-wrap"></div>
  </div>
  <div class="det-foot" id="det-foot"></div>
</aside>

<!-- MODAL (reuse existing) -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 id="modalTitle"></h2>
    <div class="modal-sub" id="modalSub"></div>
    <div id="modalBody"></div>
  </div>
</div>

// ── data helpers ─────────────────────────────────────────────
function fmt1(v){return v==null?'—':+v%1===0?String(+v):(+v).toFixed(1)}

function activeEjercicio(items){
  // find most recent ej with data across all items
  let maxEj = 0;
  for(const d of items){
    const ejs = d[8]||[];
    for(const e of ejs) if(e[0]>maxEj && e[1]!=null) maxEj=e[0];
  }
  return maxEj||1;
}

let activeEj = 1;

function ejStatus(ejSeries, ej){
  if(!ejSeries||!ejSeries.length) return {puntaje:null,obj:null,compliant:null,ejNum:ej};
  const sorted = [...ejSeries].sort((a,b)=>b[0]-a[0]);
  // find last ej with data <= ej
  let last = sorted.find(e=>e[0]<=ej && e[1]!=null);
  if(!last) last = sorted[sorted.length-1];
  const puntaje = last?last[1]:null;
  const obj = last?last[2]:null;
  const compliant = puntaje!=null && obj!=null ? (puntaje>=obj?1:0) : null;
  return {puntaje,obj,compliant,ejNum:last?last[0]:ej};
}

function histAvg(ejSeries,ej){
  if(!ejSeries) return null;
  const vals = ejSeries.filter(e=>e[0]<ej && e[1]!=null).map(e=>e[1]);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

// ── state ─────────────────────────────────────────────────────
let filterArea = null;
let filterEj = null;
let activeIdx = null;
let detailMode = 'ej';

// ── sidebar ───────────────────────────────────────────────────
function renderSidebar(){
  activeEj = activeEjercicio(ITEMS);
  document.getElementById('sb-ej-label').textContent = 'Ejercicio ' + activeEj;

  // stats
  let total=0,ok=0,no=0,nd=0;
  const areaMap = {};
  for(const d of ITEMS){
    total++;
    const s = ejStatus(d[8],filterEj||activeEj);
    if(s.compliant===1) ok++;
    else if(s.compliant===0) no++;
    else nd++;
    const a = d[2]||'Sin área';
    if(!areaMap[a]) areaMap[a]={total:0,ok:0,no:0,nd:0};
    areaMap[a].total++;
    if(s.compliant===1) areaMap[a].ok++;
    else if(s.compliant===0) areaMap[a].no++;
    else areaMap[a].nd++;
  }

  document.getElementById('sb-stats').innerHTML =
    `<div class="sb-stat"><div class="sb-stat-n">${total}</div><div class="sb-stat-l">Total</div></div>
     <div class="sb-stat ok"><div class="sb-stat-n">${ok}</div><div class="sb-stat-l">Cumplen</div></div>
     <div class="sb-stat no"><div class="sb-stat-n">${no}</div><div class="sb-stat-l">No cumplen</div></div>
     <div class="sb-stat nd"><div class="sb-stat-n">${nd}</div><div class="sb-stat-l">Sin dato</div></div>`;

  // area nav
  const areas = Object.keys(areaMap).sort();
  let html = `<div class="sb-item${!filterArea?' active':''}" onclick="selectArea(null)">
    <div class="sb-dot" style="background:#94a3b8"></div>Todas las áreas
    <span class="sb-count">${total}</span></div>`;
  for(const a of areas){
    const col = AREA_COLORS[a]||'#94a3b8';
    const init = a[0];
    html += `<div class="sb-item${filterArea===a?' active':''}" onclick="selectArea('${a.replace(/'/g,"\\\\'")}')">
      <div class="sb-dot" style="background:${col}"></div>${a}
      <span class="sb-count">${areaMap[a].total}</span></div>`;
  }
  document.getElementById('sb-areas').innerHTML = html;

  // ej nav
  const allEjs = new Set();
  for(const d of ITEMS) (d[8]||[]).forEach(e=>allEjs.add(e[0]));
  const ejList = [...allEjs].sort((a,b)=>b-a);
  let ejHtml = `<div class="sb-item${!filterEj?' active':''}" onclick="selectEj(null)">
    Todos los ejercicios<span class="sb-count">${ejList.length}</span></div>`;
  for(const e of ejList){
    ejHtml += `<div class="sb-item${filterEj===e?' active':''}" onclick="selectEj(${e})">
      Ejercicio ${e}</div>`;
  }
  document.getElementById('sb-ejs').innerHTML = ejHtml;
}

function selectArea(a){filterArea=a;activeIdx=null;closeDetail();renderAll()}
function selectEj(e){filterEj=e;activeIdx=null;closeDetail();renderAll()}

// ── list ──────────────────────────────────────────────────────
function renderList(){
  const ej = filterEj||activeEj;
  const items = filterArea
    ? ITEMS.filter(d=>(d[2]||'Sin área')===filterArea)
    : ITEMS;

  document.getElementById('list-title').textContent =
    filterArea ? filterArea : 'Todos los indicadores';
  document.getElementById('list-sub').textContent =
    items.length + ' indicadores · Ej ' + ej;

  // group by area
  const groups = {};
  for(const d of items){
    const a = d[2]||'Sin área';
    if(!groups[a]) groups[a]=[];
    groups[a].push(d);
  }

  let html = '';
  for(const [area, rows] of Object.entries(groups).sort()){
    const col = AREA_COLORS[area]||'#94a3b8';
    if(!filterArea) html += `<div class="sec-hd">${area}</div>`;
    for(const d of rows){
      const idx = ITEMS.indexOf(d);
      const s = ejStatus(d[8], ej);
      const sc = s.puntaje!=null ? fmt1(s.puntaje) : '—';
      const cls = s.compliant===1?'ok':s.compliant===0?'no':'nd';
      const chipCls = s.compliant===1?'chip-ok':s.compliant===0?'chip-no':'chip-nd';
      const chipLbl = s.compliant===1?'Cumple':s.compliant===0?'No cumple':'Sin dato';
      const init = (area||'?')[0];
      const freq = d[11]||'';
      html += `<div class="ind-row${activeIdx===idx?' active':''}" onclick="openDetail(${idx})">
        <div class="row-dot" style="background:${col}">${init}</div>
        <div class="row-info">
          <div class="row-code">${d[0]}${freq?' · '+freq:''}</div>
          <div class="row-name">${d[1]}</div>
        </div>
        <div class="row-right">
          <div class="row-score ${cls}">${sc}</div>
          <span class="chip ${chipCls}">${chipLbl}</span>
        </div>
      </div>`;
    }
  }
  document.getElementById('list-body').innerHTML = html;
}

// ── detail ────────────────────────────────────────────────────
function openDetail(idx){
  activeIdx = idx;
  renderList(); // update active row

  const d = ITEMS[idx];
  const ej = filterEj||activeEj;
  const s = ejStatus(d[8], ej);
  const area = d[2]||'Sin área';
  const col = AREA_COLORS[area]||'#94a3b8';
  const init = (area||'?')[0];

  document.getElementById('det-dot').style.background = col;
  document.getElementById('det-dot').textContent = init;
  document.getElementById('det-code').textContent = d[0];
  document.getElementById('det-name').textContent = d[1];

  const tags = [area, d[11]||''].filter(Boolean);
  document.getElementById('det-tags').innerHTML = tags.map(t=>`<span class="det-tag">${t}</span>`).join('');

  const pCls = s.compliant===1?'ok':s.compliant===0?'no':'';
  const avg = histAvg(d[8],ej);
  document.getElementById('kpis').innerHTML =
    `<div class="kpi"><div class="kpi-n ${pCls}">${fmt1(s.puntaje)}</div><div class="kpi-l">Puntaje Ej ${s.ejNum}</div></div>
     <div class="kpi"><div class="kpi-n">${fmt1(s.obj)}</div><div class="kpi-l">Objetivo</div></div>
     <div class="kpi"><div class="kpi-n">${avg!=null?fmt1(avg):'—'}</div><div class="kpi-l">Histórico</div></div>`;

  const foot = [];
  if(avg!=null) foot.push('<span>📊 Hist avg: '+fmt1(avg)+'</span>');
  // next ej obj
  const ejs = d[8]||[];
  const next = ejs.find(e=>e[0]===ej+1);
  if(next&&next[2]!=null) foot.push('<span>🎯 Ej '+(ej+1)+' obj: '+fmt1(next[2])+'</span>');
  document.getElementById('det-foot').innerHTML = foot.join('');

  document.getElementById('detail').classList.add('open');
  drawChart();
}

function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  activeIdx=null;
  renderList();
}

function setMode(m){
  detailMode=m;
  document.getElementById('btn-ej').classList.toggle('active',m==='ej');
  document.getElementById('btn-per').classList.toggle('active',m==='per');
  drawChart();
}

function drawChart(){
  if(activeIdx==null) return;
  const d = ITEMS[activeIdx];
  const ej = filterEj||activeEj;
  const col = AREA_COLORS[d[2]||'Sin área']||'#94a3b8';
  const wrap = document.getElementById('chart-wrap');
  if(detailMode==='ej'){
    wrap.innerHTML = drawEjSVG(d[8]||[], col, ej);
  } else {
    wrap.innerHTML = drawPerSVG(d[7]||[], d[8]||[], col, ej);
  }
}

function drawEjSVG(ejs, col, activeEjNum){
  const W=360, H=160, padX=30, padY=12, bw=24, gap=8;
  if(!ejs.length) return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#94a3b8" font-size="12">Sin datos</text></svg>`;
  const sorted = [...ejs].sort((a,b)=>a[0]-b[0]);
  const vals = sorted.map(e=>e[1]).filter(v=>v!=null);
  const objs = sorted.map(e=>e[2]).filter(v=>v!=null);
  const allV = [...vals,...objs];
  const minV = Math.min(...allV)*0.85, maxV = Math.max(...allV)*1.1;
  const n = sorted.length;
  const chartW = n*(bw+gap)-gap;
  const cW = Math.max(chartW, W-padX*2);
  const vw = cW + padX*2;
  const ch = H-padY*2-20;

  function ys(v){ return padY + ch - (v-minV)/(maxV-minV)*ch; }

  let bars='', labels='';
  for(let i=0;i<sorted.length;i++){
    const e = sorted[i];
    const x = padX + i*(bw+gap);
    const isActive = e[0]===activeEjNum;
    const v = e[1];
    const obj = e[2];
    if(v!=null){
      const y = ys(v), barH = H-padY-20-y;
      const meetsObj = obj!=null && v>=obj;
      const barCol = meetsObj?'#16a34a':'#dc2626';
      const op = isActive?'1':'0.35';
      bars += `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" rx="3" fill="${barCol}" opacity="${op}"/>`;
    }
    if(obj!=null){
      const yo = ys(obj);
      bars += `<line x1="${x}" y1="${yo}" x2="${x+bw}" y2="${yo}" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>`;
    }
    labels += `<text x="${x+bw/2}" y="${H-padY+14}" text-anchor="middle" fill="${e[0]===activeEjNum?'#1e293b':'#94a3b8'}" font-size="9" font-weight="${e[0]===activeEjNum?'700':'400'}">Ej${e[0]}</text>`;
  }

  return `<svg viewBox="0 0 ${vw} ${H}" xmlns="http://www.w3.org/2000/svg">${bars}${labels}</svg>`;
}

function drawPerSVG(perData, ejSeries, col, activeEjNum){
  const W=360, H=160, padX=20, padY=12, gap=4;
  // perData: [[yyyy-mm, val, obj], ...]
  // build 12 months for active ej (approximate: use all perData entries)
  if(!perData||!perData.length) return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#94a3b8" font-size="12">Sin datos de período</text></svg>`;

  const sorted = [...perData].sort((a,b)=>a[0]<b[0]?-1:1);
  const n = sorted.length;
  const bw = Math.floor((W-padX*2-(n-1)*gap)/n);
  const vals = sorted.map(e=>e[1]).filter(v=>v!=null);
  const objs = sorted.map(e=>e[2]).filter(v=>v!=null);
  const allV = [...vals,...objs];
  if(!allV.length) return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#94a3b8" font-size="12">Sin datos</text></svg>`;
  const minV = Math.min(...allV)*0.85, maxV = Math.max(...allV)*1.1;
  const ch = H-padY*2-18;
  function ys(v){ return padY + ch - (v-minV)/(maxV-minV)*ch; }

  let bars='';
  for(let i=0;i<sorted.length;i++){
    const e = sorted[i];
    const x = padX + i*(bw+gap);
    const mo = parseInt(e[0].slice(5,7),10)-1;
    const lbl = MESES[mo]||e[0].slice(5,7);
    const v = e[1];
    const obj = e[2];
    if(v!=null){
      const y = ys(v), barH = H-padY-18-y;
      const meetsObj = obj!=null && v>=obj;
      const barCol = meetsObj?'#16a34a':'#dc2626';
      bars += `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" rx="3" fill="${barCol}" opacity="0.8"/>`;
    } else {
      // pending: dashed placeholder
      bars += `<rect x="${x}" y="${padY}" width="${bw}" height="${ch}" rx="3" fill="none" stroke="#cbd5e1" stroke-dasharray="4,3"/>`;
    }
    if(obj!=null){
      const yo = ys(obj);
      bars += `<line x1="${x}" y1="${yo}" x2="${x+bw}" y2="${yo}" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>`;
    }
    bars += `<text x="${x+bw/2}" y="${H-2}" text-anchor="middle" fill="#94a3b8" font-size="8">${lbl}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
}

// ── modal (legacy, for backward compat) ──────────────────────
function openModal(i){ openDetail(i); }
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }

// ── init ──────────────────────────────────────────────────────
function renderAll(){ renderSidebar(); renderList(); }
renderAll();
</script>
