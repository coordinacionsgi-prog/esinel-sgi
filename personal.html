<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}

/* HEADER */
.esinel-hdr{background:#0f172a;border-bottom:1px solid #1e293b;position:sticky;top:0;z-index:9999}
.esinel-hdr-top{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;gap:16px}
.esinel-logo{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
.esinel-logo-name{font-size:21px;font-weight:800;color:#fff;letter-spacing:2.5px;line-height:1;text-transform:uppercase}
.esinel-logo-tagline{font-size:8.5px;font-weight:600;color:#475569;letter-spacing:1.2px;text-transform:uppercase;margin-top:2px}
.esinel-logo-certs{font-size:8px;font-weight:600;letter-spacing:.8px;margin-top:2px}
.esinel-iso9{color:#94a3b8}.esinel-iso14{color:#4caf72;margin-left:5px}.esinel-iso45{color:#ef5350;margin-left:5px}
.esinel-badge{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#3b82f6;background:rgba(59,130,246,.12);padding:4px 10px;border-radius:4px;border:1px solid rgba(59,130,246,.2)}
.esinel-nav{display:flex;align-items:center;border-top:1px solid #1e293b;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.esinel-nav::-webkit-scrollbar{display:none}
.esinel-nav-item{display:flex;align-items:center;gap:5px;padding:8px 12px;font-size:12px;font-weight:500;color:#64748b;text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;transition:color .12s,border-color .12s}
.esinel-nav-item:hover{color:#e2e8f0;border-bottom-color:#334155}
.esinel-nav-item.esinel-active{color:#60a5fa;border-bottom-color:#3b82f6;font-weight:600}
.esinel-badge-pill{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:4px}
.esinel-badge-warn{background:rgba(245,158,11,.18);color:#f59e0b}
.esinel-badge-danger{background:rgba(239,68,68,.15);color:#f87171}

/* CONTENT */
.content{padding:24px 28px;max-width:1400px;margin:0 auto}
.page-title{font-size:22px;font-weight:700;color:#f1f5f9;margin-bottom:4px}
.page-sub{font-size:13px;color:#64748b;margin-bottom:24px}

/* CONTROLS */
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.search-box{position:relative;flex:1;min-width:220px}
.search-box input{width:100%;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:9px 12px 9px 36px;font-size:13px;color:#e2e8f0;outline:none;transition:border-color .15s}
.search-box input:focus{border-color:#3b82f6}
.search-box input::placeholder{color:#475569}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#475569;font-size:14px}

/* AREA FILTERS */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{padding:6px 13px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s;letter-spacing:.02em}
.filter-btn.all{background:#1e293b;color:#94a3b8;border-color:#334155}
.filter-btn.all.active{background:#334155;color:#e2e8f0}
.filter-btn[data-area="Obras"]{background:rgba(59,130,246,.12);color:#60a5fa;border-color:rgba(59,130,246,.25)}
.filter-btn[data-area="Obras"].active{background:#3b82f6;color:#fff}
.filter-btn[data-area="Ingeniería"]{background:rgba(139,92,246,.12);color:#a78bfa;border-color:rgba(139,92,246,.25)}
.filter-btn[data-area="Ingeniería"].active{background:#8b5cf6;color:#fff}
.filter-btn[data-area="Producción"]{background:rgba(245,158,11,.1);color:#fbbf24;border-color:rgba(245,158,11,.25)}
.filter-btn[data-area="Producción"].active{background:#f59e0b;color:#0f172a}
.filter-btn[data-area="Administración y RRHH"]{background:rgba(16,185,129,.1);color:#34d399;border-color:rgba(16,185,129,.25)}
.filter-btn[data-area="Administración y RRHH"].active{background:#10b981;color:#fff}
.filter-btn[data-area="Comercial"]{background:rgba(236,72,153,.1);color:#f472b6;border-color:rgba(236,72,153,.25)}
.filter-btn[data-area="Comercial"].active{background:#ec4899;color:#fff}
.filter-btn[data-area="Gerencia"]{background:rgba(100,116,139,.12);color:#94a3b8;border-color:rgba(100,116,139,.25)}
.filter-btn[data-area="Gerencia"].active{background:#64748b;color:#fff}

/* STATS ROW */
.stats-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.stat-chip{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:8px 14px;font-size:12px;color:#94a3b8;display:flex;align-items:center;gap:8px}
.stat-chip strong{color:#e2e8f0;font-size:14px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;display:flex;align-items:flex-start;gap:14px;transition:border-color .15s,transform .1s;cursor:default}
.card:hover{border-color:#475569;transform:translateY(-1px)}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;letter-spacing:.5px}
.card-info{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:600;color:#f1f5f9;line-height:1.3;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-cargo{font-size:11.5px;color:#94a3b8;margin-bottom:6px;line-height:1.3}
.card-meta{display:flex;flex-direction:column;gap:3px}
.card-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.card-sede{font-size:10.5px;color:#64748b;display:flex;align-items:center;gap:4px;margin-top:2px}
.card-email{font-size:10.5px;color:#3b82f6;text-decoration:none;display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-email:hover{text-decoration:underline}
.no-results{text-align:center;padding:60px 20px;color:#475569;font-size:14px}

/* area colors */
.area-Obras .avatar{background:rgba(59,130,246,.2);color:#60a5fa}
.area-Obras .card-tag{background:rgba(59,130,246,.15);color:#60a5fa}
.area-Ingeniería .avatar{background:rgba(139,92,246,.2);color:#a78bfa}
.area-Ingeniería .card-tag{background:rgba(139,92,246,.15);color:#a78bfa}
.area-Producción .avatar{background:rgba(245,158,11,.15);color:#fbbf24}
.area-Producción .card-tag{background:rgba(245,158,11,.12);color:#fbbf24}
.area-Administración-y-RRHH .avatar{background:rgba(16,185,129,.15);color:#34d399}
.area-Administración-y-RRHH .card-tag{background:rgba(16,185,129,.12);color:#34d399}
.area-Comercial .avatar{background:rgba(236,72,153,.15);color:#f472b6}
.area-Comercial .card-tag{background:rgba(236,72,153,.12);color:#f472b6}
.area-Gerencia .avatar{background:rgba(100,116,139,.2);color:#cbd5e1}
.area-Gerencia .card-tag{background:rgba(100,116,139,.15);color:#cbd5e1}
.area-Ingeniería-Comercial .avatar{background:rgba(139,92,246,.2);color:#a78bfa}
.area-Ingeniería-Comercial .card-tag{background:rgba(139,92,246,.15);color:#a78bfa}
</style>

let currentFilter = '';
let currentSearch = '';

function initials(name) {
  return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function areaClass(area) {
  return 'area-' + area.replace(/\s+/g,'-').replace(/[&]/g,'');
}

function areaLabel(area) {
  const map = {'Administración y RRHH':'Adm & RRHH','Ingeniería - Comercial':'Ing. Comercial'};
  return map[area] || area;
}

function render() {
  const q = currentSearch.toLowerCase();
  const filtered = PERSONAL.filter(p => {
    const matchArea = !currentFilter || p.a === currentFilter;
    const matchSearch = !q || p.n.toLowerCase().includes(q) || p.c.toLowerCase().includes(q) || p.sede.toLowerCase().includes(q);
    return matchArea && matchSearch;
  });

  // Stats
  const areas = {};
  filtered.forEach(p => { areas[p.a] = (areas[p.a]||0)+1; });
  const statsEl = document.getElementById('stats-row');
  statsEl.innerHTML = `<div class="stat-chip"><strong>${filtered.length}</strong> personas${currentFilter?' en '+areaLabel(currentFilter):''}</div>` +
    (currentFilter ? '' : Object.entries(areas).map(([a,c])=>`<div class="stat-chip"><strong>${c}</strong> ${areaLabel(a)}</div>`).join(''));

  // Grid
  const grid = document.getElementById('grid');
  if (!filtered.length) { grid.innerHTML = '<div class="no-results">No se encontraron resultados</div>'; return; }
  grid.innerHTML = filtered.map(p => `
    <div class="card ${areaClass(p.a)}">
      <div class="avatar">${initials(p.n)}</div>
      <div class="card-info">
        <div class="card-name" title="${p.n}">${p.n}</div>
        <div class="card-cargo">${p.c}</div>
        <div class="card-meta">
          <span class="card-tag">${areaLabel(p.a)}</span>
          <span class="card-sede">📍 ${p.sede}</span>
          ${p.e ? `<a class="card-email" href="mailto:${p.e}">${p.e}</a>` : ''}
        </div>
      </div>
    </div>`).join('');
}

function setFilter(area) {
  currentFilter = area;
  document.querySelectorAll('.filter-btn').forEach(b => {
    const ba = b.dataset.area || '';
    b.classList.toggle('active', ba === area || (!area && b.classList.contains('all')));
  });
  render();
}

document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value;
  render();
});

render();
</script>
