<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Panel — SGI Esinel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#F8FAFC;--bg2:#FFFFFF;--bg3:#F1F5F9;
  --border:#E2E8F0;--border2:#CBD5E1;
  --text:#0F172A;--text2:#64748B;--text3:#94A3B8;
  --indigo:#4F46E5;--indigo-dim:#EEF2FF;--indigo-border:#C7D2FE;--indigo-text:#3730A3;
  --green:#059669;--green-dim:#ECFDF5;--green-border:#A7F3D0;--green-text:#065F46;
  --amber:#D97706;--amber-dim:#FFFBEB;--amber-border:#FDE68A;--amber-text:#92400E;
  --red:#DC2626;--red-dim:#FEF2F2;--red-border:#FECACA;--red-text:#991B1B;
  --violet:#7C3AED;--violet-dim:#F5F3FF;--violet-border:#DDD6FE;--violet-text:#5B21B6;
  --r:8px;--r2:12px;
}
[data-theme=dark]{
  --bg:#0F1117;--bg2:#161B27;--bg3:#1E2536;
  --border:#2A3347;--border2:#334060;
  --text:#F1F5FF;--text2:#8B9BB8;--text3:#4A5568;
  --indigo:#6366F1;--indigo-dim:rgba(99,102,241,.12);--indigo-border:rgba(99,102,241,.3);--indigo-text:#A5B4FC;
  --green:#10B981;--green-dim:rgba(16,185,129,.1);--green-border:rgba(16,185,129,.25);--green-text:#6EE7B7;
  --amber:#F59E0B;--amber-dim:rgba(245,158,11,.1);--amber-border:rgba(245,158,11,.25);--amber-text:#FDE68A;
  --red:#F43F5E;--red-dim:rgba(244,63,94,.1);--red-border:rgba(244,63,94,.25);--red-text:#FCA5A5;
  --violet:#A78BFA;--violet-dim:rgba(167,139,250,.1);--violet-border:rgba(167,139,250,.25);--violet-text:#C4B5FD;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;transition:background .2s,color .2s}

/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px 36px;max-width:380px;width:100%;text-align:center}
.auth-logo{width:48px;height:48px;border-radius:12px;background:var(--indigo-dim);border:1px solid var(--indigo-border);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:22px}
.auth-card h1{font-size:20px;font-weight:700;margin-bottom:6px}
.auth-card p{font-size:13px;color:var(--text2);margin-bottom:28px;line-height:1.5}
.auth-error{font-size:12px;color:var(--red-text);background:var(--red-dim);border:1px solid var(--red-border);border-radius:var(--r);padding:8px 12px;margin-top:14px;display:none}

/* TOPBAR */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;transition:background .2s}
.app-logo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;text-decoration:none;color:var(--text)}
.app-logo .dot{width:8px;height:8px;border-radius:50%;background:var(--indigo)}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 10px 4px 4px;cursor:pointer;transition:.15s}
.user-chip:hover{border-color:var(--border2)}
.avatar{width:26px;height:26px;border-radius:50%;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;background:var(--indigo-dim);color:var(--indigo);flex-shrink:0}
.user-name{font-size:12px;color:var(--text2)}
.btn-icon{width:32px;height:32px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;font-size:15px}
.btn-icon:hover{background:var(--bg3);color:var(--text)}

/* LAYOUT */
.main{max-width:900px;margin:0 auto;padding:24px 20px}
.page-title{font-size:20px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text2);margin-bottom:24px}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:24px;width:fit-content}
.tab{padding:6px 16px;border-radius:7px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:.15s;border:none;background:none;font-family:inherit;display:flex;align-items:center;gap:5px}
.tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--border)}
.tab-pane{display:none}.tab-pane.active{display:block}

/* CARDS */
.section-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;align-items:center;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.row-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;margin-bottom:8px;transition:.15s;cursor:pointer}
.row-card:hover{border-color:var(--border2);background:var(--bg3)}
.row-card.left-green{border-left:3px solid var(--green)}
.row-card.left-amber{border-left:3px solid var(--amber)}
.row-card.left-red{border-left:3px solid var(--red)}
.row-card.left-indigo{border-left:3px solid var(--indigo)}
.empty{text-align:center;padding:32px;color:var(--text3);font-size:13px;background:var(--bg3);border:1px dashed var(--border2);border-radius:var(--r2)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.b-indigo{background:var(--indigo-dim);color:var(--indigo-text);border:1px solid var(--indigo-border)}
.b-green{background:var(--green-dim);color:var(--green-text);border:1px solid var(--green-border)}
.b-amber{background:var(--amber-dim);color:var(--amber-text);border:1px solid var(--amber-border)}
.b-red{background:var(--red-dim);color:var(--red-text);border:1px solid var(--red-border)}
.b-violet{background:var(--violet-dim);color:var(--violet-text);border:1px solid var(--violet-border)}
.b-gray{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;transition:background .2s}
.modal-header{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2)}
.modal-header h3{font-size:15px;font-weight:600}
.modal-body{padding:18px 20px}
.field-label{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.field{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;color:var(--text);background:var(--bg2);font-family:inherit;margin-bottom:12px;transition:.15s}
.field:focus{outline:none;border-color:var(--indigo)}
textarea.field{resize:none}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:7px 15px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;font-family:inherit;transition:.12s}
.btn:hover{background:var(--bg3);color:var(--text)}
.btn-primary{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.btn-primary:hover{opacity:.9}
.btn-green{background:var(--green-dim);color:var(--green-text);border-color:var(--green-border)}
.btn-red{background:var(--red-dim);color:var(--red-text);border-color:var(--red-border)}
.btn-sm{padding:5px 11px;font-size:11px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--bg2);position:sticky;bottom:0}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px}
.kpi.accent{background:var(--indigo-dim);border-color:var(--indigo-border)}
.kpi.warn{background:var(--amber-dim);border-color:var(--amber-border)}
.kpi-label{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:4px}
.kpi.accent .kpi-label{color:var(--indigo-text)}
.kpi.warn .kpi-label{color:var(--amber-text)}
.kpi-val{font-size:26px;font-weight:700;color:var(--text);line-height:1}
.kpi.accent .kpi-val{color:var(--indigo-text)}
.kpi.warn .kpi-val{color:var(--amber-text)}

/* SPINNER */
.spinner{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text3)}
.spin{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--indigo);border-radius:50%;animation:spin .7s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--bg2);padding:10px 18px;border-radius:var(--r);font-size:12px;font-weight:500;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;z-index:300}
.toast.show{opacity:1;transform:none}

@media(max-width:600px){
  .kpi-row{grid-template-columns:1fr 1fr}
  .tabs{flex-wrap:wrap}
  .modal{max-height:95vh}
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo"><i class="ti ti-shield-check" style="color:var(--indigo)"></i></div>
    <h1>Mi Panel SGI</h1>
    <p>Ingresá con tu cuenta <strong>@esinel.com.ar</strong> para ver y gestionar tus hallazgos.</p>
    <div id="g_id_onload"
      data-client_id="950947921122-r5k7slfpd4t1vm40s2hhpf4hii4530o2.apps.googleusercontent.com"
      data-callback="sgiCb"
      data-auto_prompt="true">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="sign_in_with"
      data-shape="rectangular"
      data-logo_alignment="left"
      data-width="280">
    </div>
    <div class="auth-error" id="auth-error">
      Solo cuentas @esinel.com.ar pueden acceder.
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="topbar">
    <a href="index.html" class="app-logo"><div class="dot"></div>Esinel SGI</a>
    <div class="topbar-right">
      <button class="btn-icon" onclick="toggleTheme()" title="Cambiar tema"><i class="ti ti-moon" id="theme-icon"></i></button>
      <div class="user-chip" onclick="logout()" title="Cerrar sesión">
        <div class="avatar" id="user-avatar">--</div>
        <span class="user-name" id="user-name">Cargando...</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="page-title">Mi panel</div>
    <div class="page-sub" id="page-sub">Hallazgos que te involucran</div>

    <div class="tabs" id="tabs-container">
      <button class="tab active" onclick="showTab('asignados')" id="tab-asignados">
        <i class="ti ti-list-check"></i> Mis asignados
      </button>
      <button class="tab" onclick="showTab('declarados')" id="tab-declarados">
        <i class="ti ti-send"></i> Lo que declaré
      </button>
    </div>

    <div id="pane-asignados" class="tab-pane active">
      <div class="spinner"><div class="spin"></div>Cargando...</div>
    </div>
    <div id="pane-declarados" class="tab-pane">
      <div class="spinner"><div class="spin"></div>Cargando...</div>
    </div>
    <div id="pane-coord" class="tab-pane"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)cerrarModal()">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modal-title">Detalle del hallazgo</h3>
      <button class="btn-icon" onclick="cerrarModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
// Reemplazar con la URL del web app GAS después de deployar el script de RG-06-02
const GAS_URL = 'REEMPLAZAR_CON_URL_GAS';

// ── AUTH ───────────────────────────────────────────────────────────────────
let userEmail = '', userName = '', userInitials = '';

function sgiCb(resp) {
  try {
    const p = JSON.parse(atob(resp.credential.split('.')[1]));
    if (!p.email.endsWith('@esinel.com.ar') && p.email !== 'thiagobaira@gmail.com') {
      document.getElementById('auth-error').style.display = 'block';
      return;
    }
    userEmail = p.email;
    userName = p.name || p.email.split('@')[0];
    userInitials = userName.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
    sessionStorage.setItem('sgi_ok', '1');
    sessionStorage.setItem('sgi_email', userEmail);
    sessionStorage.setItem('sgi_name', userName);
    iniciarApp();
  } catch(e) {
    document.getElementById('auth-error').style.display = 'block';
  }
}

function iniciarApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-avatar').textContent = userInitials;
  document.getElementById('user-name').textContent = userName;

  const esCoord = userEmail === 'coordinacion.sgi@esinel.com.ar' || userEmail === 'thiagobaira@gmail.com';
  if (esCoord) {
    document.getElementById('page-sub').textContent = 'Panel de coordinación SGI';
    const tabCoord = document.createElement('button');
    tabCoord.className = 'tab';
    tabCoord.id = 'tab-coord';
    tabCoord.innerHTML = '<i class="ti ti-shield-check"></i> Panel SGI';
    tabCoord.onclick = () => showTab('coord');
    document.getElementById('tabs-container').appendChild(tabCoord);
  }

  cargarDatos();
}

function logout() {
  sessionStorage.clear();
  location.reload();
}

window.addEventListener('load', () => {
  if (sessionStorage.getItem('sgi_ok') === '1') {
    userEmail = sessionStorage.getItem('sgi_email') || '';
    userName = sessionStorage.getItem('sgi_name') || '';
    userInitials = userName.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
    iniciarApp();
  }
});

// ── DATOS ──────────────────────────────────────────────────────────────────
let datosPanel = null;

async function cargarDatos() {
  try {
    const url = GAS_URL + '?accion=panel&email=' + encodeURIComponent(userEmail);
    const resp = await fetch(url);
    datosPanel = await resp.json();
    renderAsignados(datosPanel.asignados || []);
    renderDeclarados(datosPanel.declarados || []);
    if (datosPanel.paraCoord) renderCoord(datosPanel.paraCoord);
  } catch(e) {
    document.getElementById('pane-asignados').innerHTML =
      '<div class="empty" style="color:var(--red-text)">No se pudieron cargar los datos. Revisá tu conexión o que el GAS esté configurado.</div>';
  }
}

// ── RENDER ASIGNADOS ───────────────────────────────────────────────────────
function renderAsignados(lista) {
  const pane = document.getElementById('pane-asignados');
  if (!lista.length) {
    pane.innerHTML = '<div class="empty"><i class="ti ti-circle-check" style="font-size:24px;display:block;margin-bottom:8px"></i>No tenés hallazgos asignados activos</div>';
    return;
  }
  pane.innerHTML = lista.map(h => {
    const accion = h.accionAC || h.accionAP || h.accionAM || '';
    const badge = estadoBadge(h.estado, h.resultado, h.fechaLim);
    const cls = cardClass(h.estado, h.resultado, h.fechaLim);
    return `<div class="row-card ${cls}" onclick="abrirModalAsignado(${h.fila})">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px">
        <div>
          <span style="font-size:13px;font-weight:600">${h.tipo}-${h.num}</span>
          <span style="font-size:11px;color:var(--text2);margin-left:8px">${h.sector}</span>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">
          ${badge}
          ${h.fechaLim ? `<span class="badge b-gray"><i class="ti ti-calendar"></i>${h.fechaLim}</span>` : ''}
        </div>
      </div>
      <div style="font-size:12px;color:var(--text2);line-height:1.5">${h.desc}</div>
      ${accion ? `<div style="font-size:11px;color:var(--text3);margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">Acción: ${accion}</div>` : ''}
    </div>`;
  }).join('');
}

// ── RENDER DECLARADOS ──────────────────────────────────────────────────────
function renderDeclarados(lista) {
  const pane = document.getElementById('pane-declarados');
  if (!lista.length) {
    pane.innerHTML = '<div class="empty"><i class="ti ti-send" style="font-size:24px;display:block;margin-bottom:8px"></i>Todavía no declaraste ningún hallazgo</div>';
    return;
  }
  pane.innerHTML = lista.map(h => `
    <div class="row-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px">
        <span style="font-size:12px;font-weight:600;color:var(--text2)">${h.fecha} · ${h.tipo}</span>
        <span class="badge ${h.numGenerado ? 'b-green' : 'b-gray'}">${h.numGenerado || h.estado}</span>
      </div>
      <div style="font-size:12px;color:var(--text);line-height:1.5">${h.descripcion}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">${h.sector}</div>
    </div>`).join('');
}

// ── RENDER COORDINADOR ─────────────────────────────────────────────────────
function renderCoord(coord) {
  const pane = document.getElementById('pane-coord');
  const listos = coord.listos || [];
  const eficacia = coord.eficacia || [];

  let html = `<div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Listos para cerrar</div><div class="kpi-val">${listos.length}</div></div>
    <div class="kpi warn"><div class="kpi-label">Eficacia pendiente</div><div class="kpi-val">${eficacia.length}</div></div>
    <div class="kpi accent"><div class="kpi-label">Mi rol</div><div class="kpi-val" style="font-size:14px;padding-top:4px">Coordinador</div></div>
  </div>`;

  if (listos.length) {
    html += `<div class="section-title"><i class="ti ti-circle-check" style="color:var(--green)"></i>Listos para cerrar</div>`;
    html += listos.map(h => `
      <div class="row-card left-green">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px">
          <span style="font-size:13px;font-weight:600">${h.tipo}-${h.num}</span>
          <span class="badge b-green"><i class="ti ti-check"></i>Evidencia lista</span>
        </div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:8px">${h.desc}</div>
        ${h.linkDrive ? `<a href="${h.linkDrive}" target="_blank" onclick="event.stopPropagation()" style="font-size:11px;color:var(--indigo);text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-bottom:10px"><i class="ti ti-folder"></i>Ver evidencia en Drive</a><br>` : ''}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
          <button class="btn btn-green btn-sm" onclick="accionCoord(${h.fila},'${h.num}','OK')"><i class="ti ti-check"></i>Cerrar OK</button>
          <button class="btn btn-red btn-sm" onclick="accionCoord(${h.fila},'${h.num}','NO')"><i class="ti ti-x"></i>Cerrar NO</button>
        </div>
      </div>`).join('');
  }

  if (eficacia.length) {
    html += `<div class="section-title" style="margin-top:20px"><i class="ti ti-clock" style="color:var(--amber)"></i>Verificación de eficacia</div>`;
    html += eficacia.map(h => `
      <div class="row-card left-amber">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px">
          <span style="font-size:13px;font-weight:600">${h.tipo}-${h.num}</span>
          <span class="badge b-amber"><i class="ti ti-clock"></i>${h.diasDesde} días desde cierre</span>
        </div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:10px">${h.desc}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-green btn-sm" onclick="accionEficacia(${h.fila},'${h.num}','OK')"><i class="ti ti-check"></i>Sí, fue eficaz</button>
          <button class="btn btn-red btn-sm" onclick="accionEficacia(${h.fila},'${h.num}','NO')"><i class="ti ti-x"></i>No fue eficaz</button>
        </div>
      </div>`).join('');
  }

  if (!listos.length && !eficacia.length) {
    html += `<div class="empty"><i class="ti ti-circle-check" style="font-size:24px;display:block;margin-bottom:8px"></i>Todo al día — no hay hallazgos pendientes de tu acción</div>`;
  }

  pane.innerHTML = html;
}

// ── MODAL ASIGNADO ─────────────────────────────────────────────────────────
function abrirModalAsignado(fila) {
  const h = (datosPanel?.asignados || []).find(x => x.fila === fila);
  if (!h) return;
  const accion = h.accionAC || h.accionAP || h.accionAM || '';
  const tipoAccion = h.accionAC ? 'AC' : (h.accionAP ? 'AP' : 'AM');

  document.getElementById('modal-title').textContent = `${h.tipo}-${h.num}`;
  document.getElementById('modal-body').innerHTML = `
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:14px">${h.desc}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">
      <span class="badge b-indigo">${h.tipo}</span>
      <span class="badge b-gray">${h.sector}</span>
      ${h.fechaLim ? `<span class="badge b-amber"><i class="ti ti-calendar"></i>${h.fechaLim}</span>` : ''}
    </div>
    <div class="field-label">Tipo de acción</div>
    <select class="field" id="m-tipo-accion">
      <option value="AC" ${tipoAccion==='AC'?'selected':''}>Acción Correctiva (AC)</option>
      <option value="AP" ${tipoAccion==='AP'?'selected':''}>Acción Preventiva (AP)</option>
      <option value="AM" ${tipoAccion==='AM'?'selected':''}>Acción de Mejora (AM)</option>
    </select>
    <div class="field-label">Descripción de la acción tomada</div>
    <textarea class="field" id="m-accion" rows="4" placeholder="Describí qué hiciste, cuándo y cómo lo corregiste">${accion}</textarea>
    <div class="field-label">Fecha de implementación</div>
    <input class="field" type="date" id="m-fecha" value="${h.fechaCierre || ''}">
    <div class="field-label">Link carpeta Drive (evidencia)</div>
    <input class="field" type="url" id="m-drive" value="${h.linkDrive || ''}" placeholder="https://drive.google.com/drive/folders/...">
    <p style="font-size:11px;color:var(--text3)">Subí la evidencia directamente a Drive y pegá el link de la carpeta acá.</p>`;

  document.getElementById('modal-footer').innerHTML = `
    <button class="btn" onclick="cerrarModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="guardarAccion(${fila},'${h.num}','${h.tipo}')">
      <i class="ti ti-send"></i> Enviar a SGI
    </button>`;

  document.getElementById('modal-overlay').classList.add('open');
}

function cerrarModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

// ── ACCIONES ───────────────────────────────────────────────────────────────
async function guardarAccion(fila, num, tipo) {
  const accionTexto = document.getElementById('m-accion').value.trim();
  const fecha = document.getElementById('m-fecha').value;
  const drive = document.getElementById('m-drive').value.trim();
  const tipoAccion = document.getElementById('m-tipo-accion').value;
  if (!accionTexto) { mostrarToast('Describí la acción tomada antes de enviar'); return; }

  const params = new URLSearchParams({
    accion: 'submitAccion',
    email: userEmail,
    fila: String(fila),
    num: num,
    tipoAccion: tipoAccion,
    accionTexto: accionTexto,
    fechaCierre: fecha,
    linkDrive: drive,
    estado: 'Evidencia subida'
  });
  try {
    await fetch(GAS_URL + '?' + params.toString());
    cerrarModal();
    mostrarToast('✓ Acción enviada al coordinador SGI');
    setTimeout(cargarDatos, 1500);
  } catch(e) {
    mostrarToast('Error al enviar — revisá tu conexión');
  }
}

async function accionCoord(fila, num, resultado) {
  const obs = prompt(resultado === 'NO'
    ? 'Observaciones para el cierre NO (se abrirá un nuevo hallazgo automáticamente):'
    : 'Observaciones opcionales para el cierre OK:') ?? '';
  const params = new URLSearchParams({
    accion: 'cerrarHallazgo',
    email: userEmail,
    fila: String(fila),
    num: num,
    resultado: resultado,
    obs: obs
  });
  try {
    await fetch(GAS_URL + '?' + params.toString());
    mostrarToast('✓ Hallazgo cerrado ' + resultado);
    setTimeout(cargarDatos, 1500);
  } catch(e) {
    mostrarToast('Error al cerrar');
  }
}

async function accionEficacia(fila, num, resultado) {
  const obs = prompt('Observaciones de la verificación de eficacia:') ?? '';
  const params = new URLSearchParams({
    accion: 'eficacia',
    email: userEmail,
    fila: String(fila),
    num: num,
    resultado: resultado,
    obs: obs
  });
  try {
    await fetch(GAS_URL + '?' + params.toString());
    mostrarToast('✓ Eficacia registrada');
    setTimeout(cargarDatos, 1500);
  } catch(e) {
    mostrarToast('Error al registrar');
  }
}

// ── UI HELPERS ─────────────────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('pane-' + tab).classList.add('active');
}

function estadoBadge(estado, resultado, fechaLim) {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  if (resultado === 'OK') return '<span class="badge b-green"><i class="ti ti-check"></i>Cerrado OK</span>';
  if (resultado === 'NO') return '<span class="badge b-red"><i class="ti ti-x"></i>Cerrado NO</span>';
  if (fechaLim) {
    const fl = new Date(fechaLim);
    if (fl < hoy) return '<span class="badge b-red"><i class="ti ti-alert-triangle"></i>Vencido</span>';
    const dias = Math.ceil((fl - hoy) / 86400000);
    if (dias <= 30) return `<span class="badge b-amber"><i class="ti ti-clock"></i>${dias}d para vencer</span>`;
  }
  if (estado) return `<span class="badge b-indigo">${estado}</span>`;
  return '<span class="badge b-gray">En proceso</span>';
}

function cardClass(estado, resultado, fechaLim) {
  if (resultado === 'OK') return 'left-green';
  if (resultado === 'NO') return 'left-red';
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  if (fechaLim && new Date(fechaLim) < hoy) return 'left-red';
  if (fechaLim) {
    const dias = Math.ceil((new Date(fechaLim) - hoy) / 86400000);
    if (dias <= 30) return 'left-amber';
  }
  return 'left-indigo';
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

let dark = false;
function toggleTheme() {
  dark = !dark;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : '');
  document.getElementById('theme-icon').className = dark ? 'ti ti-sun' : 'ti ti-moon';
}
</script>
</body>
</html>
