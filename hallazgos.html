<script>(function(){try{
  var h=JSON.parse(localStorage.getItem('esinel_hallazgos_stats')||'null');

<iframe id="appFrame"
  src="https://script.google.com/macros/s/AKfycbzeP51JLuK6BpgTS0qfRXrNa-sI627ztn2BHqPOh4Xh8VIPmvMvx4-3hrQeHaczKbEv/exec"
  allowfullscreen loading="lazy"
  title="Hallazgos SGI"></iframe>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzeP51JLuK6BpgTS0qfRXrNa-sI627ztn2BHqPOh4Xh8VIPmvMvx4-3hrQeHaczKbFv/exec';
const frame = document.getElementById('appFrame');
let dataSent = false;

async function fetchAndSend() {
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?format=json');
    const json = await res.json();
    if (json.status === 'success' && json.data) {
      sendToFrame(json.data);
    }
  } catch(e) {}
}

function sendToFrame(data) {
  if (dataSent) return;
  try {
    const abiertos = data.filter(h =>
      Object.values(h).some(v => typeof v === 'string' && v.toLowerCase().includes('abiert'))
    ).length;
    localStorage.setItem('esinel_hallazgos_stats', JSON.stringify({
      total: data.length, abiertos, ts: Date.now()
    }));
    // Guardar datos completos para que documentos.html los lea sin fetch propio
    localStorage.setItem('esinel_hallazgos_data', JSON.stringify({ data, ts: Date.now() }));
  } catch(e) {}
  try {
    frame.contentWindow.postMessage({ type: 'hallazgosData', data: data }, '*');
    dataSent = true;
  } catch(e) {}
}

frame.addEventListener('load', function() {
  setTimeout(fetchAndSend, 1500);
});
</script>
