<iframe id="appFrame"
  src="https://script.google.com/macros/s/AKfycbzCmAsklzI7jOuNC9PzVyPxJCtlvbnc7e_lIEptqqMDsh-bplOgP8SeHi3gUinNdZ-C/exec"
  allowfullscreen loading="lazy"
  title="Hallazgos SGI"></iframe>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzCmAsklzI7jOuNC9PzVyPxJCtlvbnc7e_lIEptqqMDsh-bplOgP8SeHi3gUinNdZ-C/exec';
const frame = document.getElementById('appFrame');
let dataSent = false;
let metaCache = null;

async function fetchMeta() {
  if (metaCache) return metaCache;
  try {
    const res = await fetch('hallazgos-meta.json?_=' + Date.now());
    metaCache = await res.json();
  } catch(e) { metaCache = {}; }
  return metaCache;
}

function ejercicioDeHallazgo(h) {
  // Ejercicio = año fiscal abril-marzo. Ej35 = abr2025-mar2026, Ej36 = abr2026-mar2027...
  const BASE_EJ = 35, BASE_AÑO = 2026;
  const fecha = h.fechaVerificacion || h.fechaLimite || h.fechaRealCierre || '';
  if (!fecha) return null;
  const d = new Date(fecha);
  if (isNaN(d)) return null;
  const año = d.getFullYear();
  const mes = d.getMonth(); // 0=ene, 3=abr
  const añoFiscal = mes >= 3 ? año : año - 1; // abril o posterior = ese año
  return 'ejercicio' + (BASE_EJ + (añoFiscal - BASE_AÑO));
}

function mergeWithMeta(data, meta) {
  // Ordenar más reciente primero
  const sorted = [...data].sort((a, b) => {
    const fa = a.fechaLimite || a.fechaRealCierre || '';
    const fb = b.fechaLimite || b.fechaRealCierre || '';
    return fb.localeCompare(fa);
  });
  return sorted.map(h => {
    const ejKey = ejercicioDeHallazgo(h);
    const ej = (ejKey && meta[ejKey]) ? meta[ejKey] : {};
    const num = String(h.numHallazgo || '');
    return {
      ...h,
      _ejercicio: ejKey,
      _tipo: h.categoriasSGI || (ej.tipos || {})[num] || null,
      _docRequerido: (ej.documentos || {})[num] || null
    };
  });
}

async function fetchAndSend() {
  try {
    const [res, meta] = await Promise.all([
      fetch(APPS_SCRIPT_URL + '?format=json'),
      fetchMeta()
    ]);
    const json = await res.json();
    if (json.status === 'success' && json.data) {
      sendToFrame(mergeWithMeta(json.data, meta));
    }
  } catch(e) {}
}

function isFindingOpen(h) {
  const efic = (h.resultadoEficacia || '').trim();
  return efic !== 'OK' && efic !== 'NO';
}

function sendToFrame(data) {
  if (dataSent) return;
  try {
    const abiertos = data.filter(isFindingOpen).length;
    localStorage.setItem('esinel_hallazgos_stats', JSON.stringify({
      total: data.length, abiertos, ts: Date.now()
    }));
    localStorage.setItem('esinel_hallazgos_data', JSON.stringify({ data, ts: Date.now() }));
  } catch(e) {}
  try {
    // Filtrar por ?tipo= si viene en la URL
    const tipoParam = new URLSearchParams(location.search).get('tipo');
    const payload = tipoParam ? data.filter(h => (h._tipo || '').toLowerCase() === tipoParam.toLowerCase()) : data;
    frame.contentWindow.postMessage({ type: 'hallazgosData', data: payload }, '*');
    dataSent = true;
  } catch(e) {}
}

frame.addEventListener('load', function() {
  setTimeout(fetchAndSend, 1500);
});

// El iframe fetchea sus propios datos del spreadsheet y nos los envía de vuelta
window.addEventListener('message', function(e) {
  if (dataSent) return;
  if (e.data && e.data.type === 'hallazgosReady' && Array.isArray(e.data.data)) {
    fetchMeta().then(function(meta) {
      sendToFrame(mergeWithMeta(e.data.data, meta));
    });
  }
});
</script>
