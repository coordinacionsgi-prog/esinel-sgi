<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGI - Hallazgos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f9fa;--bg2:#fff;--tx:#1a1a2e;--tx2:#666;--bdr:#e0e0e0;--mg:#e91e8c}
@media(prefers-color-scheme:dark){:root{--bg:#111;--bg2:#1a1a1a;--tx:#f0f0f0;--tx2:#999;--bdr:#2a2a2a}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100vh}
.hdr{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.back{font-size:12px;color:var(--tx2);text-decoration:none;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:6px;transition:background .12s}
.back:hover{background:var(--bdr)}
.sep{color:var(--bdr);font-size:14px}
.hdr-badge{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mg);background:rgba(233,30,140,.1);padding:3px 8px;border-radius:4px}
.hdr-title{font-size:14px;font-weight:600;color:var(--tx)}
iframe{flex:1;border:none;width:100%}
</style>
</head>
<body>
<div class="hdr">
  <a class="back" href="index.html">← Inicio</a>
  <span class="sep">|</span>
  <div class="hdr-badge">SGI</div>
  <div class="hdr-title">Hallazgos</div>
</div>
<iframe id="appFrame"
  src="https://script.google.com/macros/s/AKfycbzeP51JLuK6BpgTS0qfRXrNa-sI627ztn2BHqPOh4Xh8VIPmvMvx4-3hrQeHaczKbEv/exec"
  allowfullscreen loading="lazy"
  title="Hallazgos SGI"></iframe>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzeP51JLuK6BpgTS0qfRXrNa-sI627ztn2BHqPOh4Xh8VIPmvMvx4-3hrQeHaczKbFv/exec';
const frame = document.getElementById('appFrame');
let dataSent = false;

async function fetchAndSend() {
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?format=json');
    const json = await res.json();
    if (json.status === 'success' && json.data) {
      sendToFrame(json.data);
    }
  } catch(e) {}
}

function sendToFrame(data) {
  if (dataSent) return;
  try {
    frame.contentWindow.postMessage({ type: 'hallazgosData', data: data }, '*');
    dataSent = true;
  } catch(e) {}
}

frame.addEventListener('load', function() {
  setTimeout(fetchAndSend, 1500);
});
</script>
</body>
</html>
